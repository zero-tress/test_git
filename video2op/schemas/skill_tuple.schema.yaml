$schema: http://json-schema.org/draft-07/schema#
title: Cross-video Skill Tuple standard view
type: object
required: [schema_version, skills, predicates]
properties:
  schema_version: {const: skill_tuple.v1}
  predicates: {type: object}
  skills:
    type: array
    items:
      type: object
      required: [skill_id, goal_key, X, O, C_pre, C_const, E, C_post, R, provenance, verification_status, unresolved]
      properties:
        skill_id: {type: string, minLength: 1}
        goal_key: {type: string, minLength: 1}
        X:
          type: object
          required: [subject, roles, binding_status]
          properties:
            subject: {type: string}
            roles: {type: array, items: {type: string}}
            binding_status: {enum: [unbound, bound]}
        O:
          type: object
          required: [roles, object_categories, bindings]
        C_pre: {type: array}
        C_const: {type: array}
        E: {type: array, minItems: 1, items: {type: string}}
        C_post: {type: array, minItems: 1, items: {type: string}}
        R:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, realization_ref, instance_ids, C_pre, C_const, selection_guard]
        provenance: {type: array, minItems: 1}
        verification_status: {enum: [verified, unverified, unverifiable]}
        unresolved: {type: array, items: {type: string}}
